<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Página no encontrada</title>
<link rel="stylesheet" href="../../shared/styles.css">
</head>
<body>

<nav role="navigation" aria-label="Navegación" style="height:80px;border-bottom:1px solid var(--color-border);display:flex;align-items:center;padding:0 var(--space-6);background:var(--color-bg);">
  <span class="nav-bar__logo">Logo</span>
</nav>

<main style="background:var(--color-surface);min-height:calc(100vh - 80px);display:flex;align-items:center;justify-content:center;">
  <div style="max-width:500px;margin:0 auto;padding:var(--space-8) var(--space-4);text-align:center">
    <p style="font-size:clamp(5rem,15vw,10rem);font-weight:800;line-height:1;color:var(--color-border);margin:0">404</p>
    <h1 style="margin:var(--space-4) 0 var(--space-3)">Página no encontrada</h1>
    <p style="color:var(--color-text-muted);margin:0 0 var(--space-8)">Lo sentimos, la página que buscas no existe o ha sido movida. Comprueba la URL o vuelve al inicio.</p>
    <div style="display:flex;gap:var(--space-3);justify-content:center;flex-wrap:wrap">
      <a href="#" class="btn">Volver al inicio</a>
      <a href="#" class="btn--link">&#8592; Volver atrás</a>
    </div>
  </div>
</main>

<footer style="border-top:1px solid var(--color-border);height:60px;display:flex;align-items:center;justify-content:center;background:var(--color-bg);">
  <p style="margin:0;color:var(--color-text-muted);font-size:0.875rem">© 2025 Nombre de empresa. Todos los derechos reservados.</p>
</footer>

<script src="../../shared/wireframe.js" defer></script>
</body>
</html>
