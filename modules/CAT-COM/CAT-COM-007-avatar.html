<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAT-COM-007 · Avatar</title>
<link rel="stylesheet" href="../../shared/styles.css">
<style>
/* ── Avatar base ── */
.avatar {
  position: relative; display: inline-flex;
  align-items: center; justify-content: center;
  flex-shrink: 0;
  width: 40px; height: 40px;
  border-radius: 50%;
  background: var(--color-surface);
  border: 1.5px solid var(--color-border);
  font-family: var(--font-heading);
  font-weight: 700; font-size: 0.9rem;
  color: var(--color-text);
  overflow: hidden;
}
/* Placeholder image fill */
.avatar__img { width: 100%; height: 100%; object-fit: cover; background: var(--color-placeholder, #c0c0c0); display: block; }
/* Initials fallback */
.avatar__initials { font-size: inherit; font-weight: 700; letter-spacing: 0.02em; }
/* Icon fallback (anonymous person) */
.avatar__icon { font-size: 1.1em; color: var(--color-text-muted); }

/* ── Sizes ── */
.avatar--xs { width: 24px; height: 24px; font-size: 0.6rem; }
.avatar--sm { width: 32px; height: 32px; font-size: 0.75rem; }
.avatar--md { width: 40px; height: 40px; font-size: 0.9rem; } /* default */
.avatar--lg { width: 56px; height: 56px; font-size: 1.1rem; }
.avatar--xl { width: 72px; height: 72px; font-size: 1.4rem; }

/* ── Status dot ── */
.avatar__status {
  position: absolute; bottom: 1px; right: 1px;
  width: 10px; height: 10px;
  border-radius: 50%; border: 2px solid var(--color-bg);
}
.avatar--xs .avatar__status, .avatar--sm .avatar__status { width: 8px; height: 8px; }
.avatar--lg .avatar__status, .avatar--xl .avatar__status { width: 13px; height: 13px; }
.avatar__status--online  { background: #22c55e; }
.avatar__status--offline { background: var(--color-border); }
.avatar__status--busy    { background: #f59e0b; }

/* ── Group / stack ── */
.avatar-group { display: flex; }
.avatar-group .avatar { border: 2px solid var(--color-bg); margin-left: -10px; }
.avatar-group .avatar:first-child { margin-left: 0; }
.avatar-group .avatar--count { background: var(--color-surface); font-size: 0.75rem; color: var(--color-text-muted); font-weight: 600; }

/* ── Layout ── */
.com007__section-title { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-text-muted); margin: 0 0 var(--space-4); padding-bottom: var(--space-2); border-bottom: 1px solid var(--color-border); }
.com007__block { display: flex; flex-direction: column; gap: var(--space-8); }
.com007__row { display: flex; flex-wrap: wrap; gap: var(--space-4); align-items: center; }
.com007__cell { display: flex; flex-direction: column; align-items: center; gap: var(--space-2); }
.com007__cell-label { font-size: 0.72rem; color: var(--color-text-muted); }
</style>
</head>
<body>

<section class="section" id="com007-section">
  <div class="container">

    <div class="com007__block">

      <!-- 1. Variantes -->
      <div>
        <p class="com007__section-title">Variantes</p>
        <div class="com007__row">

          <div class="com007__cell">
            <div class="avatar avatar--md">
              <div class="avatar__img"></div>
            </div>
            <span class="com007__cell-label">Imagen</span>
          </div>

          <div class="com007__cell">
            <div class="avatar avatar--md">
              <span class="avatar__initials">AB</span>
            </div>
            <span class="com007__cell-label">Iniciales</span>
          </div>

          <div class="com007__cell">
            <div class="avatar avatar--md">
              <span class="avatar__icon">👤</span>
            </div>
            <span class="com007__cell-label">Anónimo</span>
          </div>

        </div>
      </div>

      <!-- 2. Tamaños -->
      <div>
        <p class="com007__section-title">Tamaños</p>
        <div class="com007__row" style="align-items: flex-end;">

          <div class="com007__cell">
            <div class="avatar avatar--xs">
              <span class="avatar__initials">ML</span>
            </div>
            <span class="com007__cell-label">XS · 24px</span>
          </div>

          <div class="com007__cell">
            <div class="avatar avatar--sm">
              <span class="avatar__initials">ML</span>
            </div>
            <span class="com007__cell-label">SM · 32px</span>
          </div>

          <div class="com007__cell">
            <div class="avatar avatar--md">
              <span class="avatar__initials">ML</span>
            </div>
            <span class="com007__cell-label">MD · 40px (default)</span>
          </div>

          <div class="com007__cell">
            <div class="avatar avatar--lg">
              <span class="avatar__initials">ML</span>
            </div>
            <span class="com007__cell-label">LG · 56px</span>
          </div>

          <div class="com007__cell">
            <div class="avatar avatar--xl">
              <span class="avatar__initials">ML</span>
            </div>
            <span class="com007__cell-label">XL · 72px</span>
          </div>

        </div>
      </div>

      <!-- 3. Con estado de presencia -->
      <div>
        <p class="com007__section-title">Con estado de presencia</p>
        <div class="com007__row">

          <div class="com007__cell">
            <div class="avatar avatar--lg">
              <span class="avatar__initials">AB</span>
              <span class="avatar__status avatar__status--online"></span>
            </div>
            <span class="com007__cell-label">Conectado</span>
          </div>

          <div class="com007__cell">
            <div class="avatar avatar--lg">
              <span class="avatar__initials">CD</span>
              <span class="avatar__status avatar__status--offline"></span>
            </div>
            <span class="com007__cell-label">Desconectado</span>
          </div>

          <div class="com007__cell">
            <div class="avatar avatar--lg">
              <span class="avatar__initials">EF</span>
              <span class="avatar__status avatar__status--busy"></span>
            </div>
            <span class="com007__cell-label">Ocupado</span>
          </div>

          <div class="com007__cell">
            <div class="avatar avatar--lg">
              <span class="avatar__initials">GH</span>
            </div>
            <span class="com007__cell-label">Sin estado</span>
          </div>

        </div>
      </div>

      <!-- 4. Grupo apilado -->
      <div>
        <p class="com007__section-title">Grupo apilado</p>
        <div class="com007__row">
          <div class="com007__cell">
            <div class="avatar-group">
              <div class="avatar avatar--md">
                <span class="avatar__initials">AN</span>
              </div>
              <div class="avatar avatar--md">
                <span class="avatar__initials">BL</span>
              </div>
              <div class="avatar avatar--md">
                <span class="avatar__initials">CM</span>
              </div>
              <div class="avatar avatar--md avatar--count">
                <span class="avatar__initials">+3</span>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>

<details class="kit-states">
  <summary>Estados del módulo</summary>
  <div class="kit-states__body">

    <div class="kit-states__group">
      <p class="kit-states__group-label">Fondo</p>
      <label class="kit-states__option">
        <input type="radio" name="bg" value="var(--color-bg)" checked> Blanco
      </label>
      <label class="kit-states__option">
        <input type="radio" name="bg" value="var(--color-surface)"> Gris (alt)
      </label>
    </div>

  </div>
</details>

<details class="kit-notes" data-spec-src="../../registry/CAT-COM/CAT-COM-007-avatar.md">
  <summary class="kit-notes__toggle">Notas para UI — CAT-COM-007</summary>
  <div class="kit-notes__body"><p>Cargando…</p></div>
</details>

<script src="../../shared/wireframe.js" defer></script>
<script src="../../shared/kit-notes.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  function byId(id) { return document.getElementById(id); }
  function onRadioGroup(name, cb) { document.querySelectorAll('input[name="'+name+'"]').forEach(function(r){ r.addEventListener('change', function(){ if(r.checked) cb(r.value); }); }); }
  onRadioGroup('bg', function(v){ byId('com007-section').style.background = v; });
});
</script>

</body>
</html>
