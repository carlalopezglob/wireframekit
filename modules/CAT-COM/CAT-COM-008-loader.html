<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAT-COM-008 · Loader</title>
<link rel="stylesheet" href="../../shared/styles.css">
<style>
/* ── Local spacing token not in shared ── */
:root { --space-10: 2.5rem; }

/* ── Spinner ── */
@keyframes spin { to { transform: rotate(360deg); } }
.spinner {
  display: inline-block; border-radius: 50%;
  border: 2.5px solid var(--color-border);
  border-top-color: var(--color-accent);
  animation: spin 0.7s linear infinite;
  width: 32px; height: 32px;
}
.spinner--sm { width: 18px; height: 18px; border-width: 2px; }
.spinner--lg { width: 48px; height: 48px; border-width: 3px; }

/* ── Dots ── */
@keyframes dot-bounce { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
.dots { display: inline-flex; gap: 6px; align-items: center; }
.dots span {
  display: block; width: 8px; height: 8px;
  border-radius: 50%; background: var(--color-accent);
  animation: dot-bounce 1.2s infinite ease-in-out;
}
.dots span:nth-child(2) { animation-delay: 0.15s; }
.dots span:nth-child(3) { animation-delay: 0.3s; }
.dots--sm span { width: 5px; height: 5px; }
.dots--lg span { width: 12px; height: 12px; gap: 8px; }

/* ── Progress bar ── */
@keyframes progress-indeterminate { 0% { left: -40%; } 100% { left: 110%; } }
.progress-bar {
  width: 100%; max-width: 320px; height: 6px;
  background: var(--color-surface); border-radius: 999px;
  overflow: hidden; position: relative;
}
.progress-bar__fill {
  position: absolute; left: 0; top: 0; height: 100%;
  background: var(--color-accent); border-radius: 999px;
  animation: progress-indeterminate 1.4s infinite ease-in-out;
  width: 40%;
}
.progress-bar--determinate .progress-bar__fill { width: 65%; animation: none; }

/* ── Skeleton ── */
@keyframes shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
.skeleton {
  background: linear-gradient(90deg, var(--color-surface) 25%, var(--color-border) 50%, var(--color-surface) 75%);
  background-size: 800px 100%;
  animation: shimmer 1.4s infinite linear;
  border-radius: var(--radius-sm);
}
.skeleton--text   { height: 14px; border-radius: 4px; }
.skeleton--title  { height: 22px; border-radius: 4px; }
.skeleton--circle { border-radius: 50%; }
.skeleton--rect   { border-radius: var(--radius-md); }

/* ── Skeleton card example ── */
.sk-card { display: flex; gap: var(--space-3); align-items: flex-start; max-width: 320px; }
.sk-card__avatar { width: 40px; height: 40px; flex-shrink: 0; }
.sk-card__lines  { flex: 1; display: flex; flex-direction: column; gap: var(--space-2); padding-top: var(--space-1); }

/* ── Skeleton paragraph lines ── */
.sk-paragraph { display: flex; flex-direction: column; gap: var(--space-2); max-width: 320px; }

/* ── Layout ── */
.com008__section-title {
  font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--color-text-muted);
  margin: 0 0 var(--space-4);
  padding-bottom: var(--space-2);
  border-bottom: 1px solid var(--color-border);
}
.com008__block { display: flex; flex-direction: column; gap: var(--space-10); }
.com008__row   { display: flex; flex-wrap: wrap; gap: var(--space-8); align-items: center; }
.com008__cell  { display: flex; flex-direction: column; align-items: center; gap: var(--space-3); }
.com008__cell-label { font-size: 0.75rem; color: var(--color-text-muted); }

/* ── Progress bar rows — left-aligned, stacked ── */
.com008__progress-group { display: flex; flex-direction: column; gap: var(--space-6); }
.com008__progress-item  { display: flex; flex-direction: column; gap: var(--space-2); }
.com008__progress-label { font-size: 0.75rem; color: var(--color-text-muted); }
</style>
</head>
<body>

<section class="section" id="com008-section">
  <div class="container">

    <div class="com008__block">

      <!-- 1. Spinner -->
      <div>
        <p class="com008__section-title">Spinner</p>
        <div class="com008__row">

          <div class="com008__cell">
            <span class="spinner spinner--sm" role="status" aria-label="Cargando"></span>
            <span class="com008__cell-label">Small · 18px</span>
          </div>

          <div class="com008__cell">
            <span class="spinner" role="status" aria-label="Cargando"></span>
            <span class="com008__cell-label">Normal · 32px</span>
          </div>

          <div class="com008__cell">
            <span class="spinner spinner--lg" role="status" aria-label="Cargando"></span>
            <span class="com008__cell-label">Grande · 48px</span>
          </div>

        </div>
      </div>

      <!-- 2. Puntos -->
      <div>
        <p class="com008__section-title">Puntos</p>
        <div class="com008__row">

          <div class="com008__cell">
            <span class="dots dots--sm" role="status" aria-label="Cargando">
              <span></span><span></span><span></span>
            </span>
            <span class="com008__cell-label">Small · 5px</span>
          </div>

          <div class="com008__cell">
            <span class="dots" role="status" aria-label="Cargando">
              <span></span><span></span><span></span>
            </span>
            <span class="com008__cell-label">Normal · 8px</span>
          </div>

          <div class="com008__cell">
            <span class="dots dots--lg" role="status" aria-label="Cargando">
              <span></span><span></span><span></span>
            </span>
            <span class="com008__cell-label">Grande · 12px</span>
          </div>

        </div>
      </div>

      <!-- 3. Barra de progreso -->
      <div>
        <p class="com008__section-title">Barra de progreso</p>
        <div class="com008__progress-group">

          <div class="com008__progress-item">
            <span class="com008__progress-label">Indeterminado</span>
            <div class="progress-bar" role="progressbar" aria-label="Cargando">
              <div class="progress-bar__fill"></div>
            </div>
          </div>

          <div class="com008__progress-item">
            <span class="com008__progress-label">Determinado (65%)</span>
            <div class="progress-bar progress-bar--determinate" role="progressbar" aria-valuenow="65" aria-valuemin="0" aria-valuemax="100" aria-label="65% completado">
              <div class="progress-bar__fill"></div>
            </div>
          </div>

        </div>
      </div>

      <!-- 4. Skeleton (placeholder de carga) -->
      <div>
        <p class="com008__section-title">Skeleton (placeholder de carga)</p>
        <div class="com008__row" style="align-items: flex-start; flex-direction: column; gap: var(--space-6);">

          <!-- Card skeleton -->
          <div class="sk-card" aria-hidden="true">
            <div class="skeleton skeleton--circle sk-card__avatar"></div>
            <div class="sk-card__lines">
              <div class="skeleton skeleton--title" style="width: 60%;"></div>
              <div class="skeleton skeleton--text"  style="width: 100%;"></div>
              <div class="skeleton skeleton--text"  style="width: 80%;"></div>
            </div>
          </div>

          <!-- Paragraph skeleton -->
          <div class="sk-paragraph" aria-hidden="true">
            <div class="skeleton skeleton--text" style="width: 100%;"></div>
            <div class="skeleton skeleton--text" style="width: 90%;"></div>
            <div class="skeleton skeleton--text" style="width: 60%;"></div>
          </div>

        </div>
      </div>

    </div>
  </div>
</section>

<details class="kit-states">
  <summary>Estados del módulo</summary>
  <div class="kit-states__body">

    <div class="kit-states__group">
      <p class="kit-states__group-label">Fondo</p>
      <label class="kit-states__option">
        <input type="radio" name="bg" value="var(--color-bg)" checked> Blanco
      </label>
      <label class="kit-states__option">
        <input type="radio" name="bg" value="var(--color-surface)"> Gris (alt)
      </label>
    </div>

  </div>
</details>

<details class="kit-notes" data-spec-src="../../registry/CAT-COM/CAT-COM-008-loader.md">
  <summary class="kit-notes__toggle">Notas para UI — CAT-COM-008</summary>
  <div class="kit-notes__body"><p>Cargando…</p></div>
</details>

<script src="../../shared/wireframe.js" defer></script>
<script src="../../shared/kit-notes.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  function byId(id) { return document.getElementById(id); }
  function onRadioGroup(name, cb) { document.querySelectorAll('input[name="'+name+'"]').forEach(function(r){ r.addEventListener('change', function(){ if(r.checked) cb(r.value); }); }); }
  onRadioGroup('bg', function(v){ byId('com008-section').style.background = v; });
});
</script>

</body>
</html>
