<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAT-FRM-003 · Buscador</title>
<link rel="stylesheet" href="../../shared/styles.css">
<style>
/* ── frm003__ Buscador v2 ──────────────────────────────────────────
   Arquitectura: search experience (default → autocomplete)
                 + results experience (resultados → filtros → vacíos)
   ─────────────────────────────────────────────────────────────── */

/* ── Icons inline ── */
.frm003__ico {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  color: var(--color-text-muted);
  line-height: 1;
}

/* ═══════════════════════════════════════
   SEARCH EXPERIENCE — hero centered
═══════════════════════════════════════ */
.frm003__hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-6);
  padding: var(--space-12) var(--space-4) var(--space-8);
}

.frm003__hero-kicker {
  font-size: 0.75rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--color-text-muted);
}

/* Input — wrapper holds border so clear btn stays inside */
.frm003__input-wrap {
  position: relative;
  width: 100%;
  max-width: 560px;
}
.frm003__input-wrap--compact {
  flex: 1;
  max-width: none;
}
.frm003__input {
  width: 100%;
  height: var(--control-height-md);
  border: 1.5px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: 0 var(--space-12) 0 var(--space-12);
  font-size: 0.9375rem;
  font-family: var(--font-base);
  color: var(--color-text);
  background: var(--color-bg);
  display: flex;
  align-items: center;
  cursor: text;
}
.frm003__input--sm {
  height: var(--control-height-sm);
  font-size: 0.875rem;
  border-radius: var(--radius-sm);
  padding: 0 var(--space-8) 0 var(--space-8);
}
.frm003__input.is-focus {
  border-color: var(--color-text);
  box-shadow: 0 0 0 3px rgba(26,26,26,0.08);
}
.frm003__placeholder { color: var(--color-placeholder); }
.frm003__query { color: var(--color-text); }
.frm003__cursor {
  display: inline-block;
  width: 1.5px;
  height: 0.9em;
  background: var(--color-text);
  vertical-align: middle;
  margin-left: 1px;
  animation: frm003-blink 0.9s step-end infinite;
}
@keyframes frm003-blink { 50% { opacity: 0; } }

.frm003__icon-l,
.frm003__icon-r {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  color: var(--color-text-muted);
}
.frm003__icon-l { left: var(--space-4); }
.frm003__icon-r { right: var(--space-4); cursor: pointer; }

/* Popular chips row (default state) */
.frm003__popular {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-wrap: wrap;
  justify-content: center;
}
.frm003__pop-label {
  font-size: 0.8rem;
  color: var(--color-text-muted);
}
.frm003__pop-chip {
  padding: var(--space-1) var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: 999px;
  font-size: 0.8rem;
  color: var(--color-text-muted);
  background: var(--color-bg);
  cursor: pointer;
  font-family: var(--font-base);
}

/* ═══════════════════════════════════════
   DROPDOWN — autocomplete / focus
═══════════════════════════════════════ */
.frm003__dropdown {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-md);
  z-index: 30;
  overflow: hidden;
}
.frm003__dd-section { padding: var(--space-2) 0 var(--space-1); }
.frm003__dd-label {
  padding: 0 var(--space-4) var(--space-2);
  font-size: 0.7rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--color-text-muted);
}
.frm003__dd-item {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-4);
  cursor: pointer;
  color: var(--color-text);
  font-size: 0.875rem;
}
.frm003__dd-item:hover,
.frm003__dd-item.is-hover {
  background: var(--color-surface);
}
.frm003__dd-text { flex: 1; line-height: 1.2; }
.frm003__dd-match { font-weight: 600; }
.frm003__dd-badge {
  font-size: 0.7rem;
  padding: 1px 6px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  color: var(--color-text-muted);
}
.frm003__dd-sep { height: 1px; background: var(--color-border); margin: var(--space-1) 0; }

/* ═══════════════════════════════════════
   RESULTS EXPERIENCE — topbar
═══════════════════════════════════════ */
.frm003__topbar {
  background: var(--color-bg);
  border-bottom: 1px solid var(--color-border);
  padding: var(--space-3) var(--space-6);
  display: flex;
  align-items: center;
  gap: var(--space-4);
}
@media (max-width: 767px) {
  .frm003__topbar { padding: var(--space-2) var(--space-4); gap: var(--space-2); }
}

/* Filter bar */
.frm003__filter-bar {
  background: var(--color-bg);
  border-bottom: 1px solid var(--color-border);
  padding: var(--space-2) var(--space-6);
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-wrap: wrap;
}
@media (max-width: 767px) {
  .frm003__filter-bar {
    padding: var(--space-2) var(--space-4);
    flex-wrap: nowrap;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .frm003__filter-bar::-webkit-scrollbar { display: none; }
}
.frm003__filter-btn {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-1) var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  background: var(--color-bg);
  font-size: 0.8rem;
  font-family: var(--font-base);
  color: var(--color-text);
  cursor: pointer;
  white-space: nowrap;
  height: 32px;
}
.frm003__filter-btn.has-active {
  border-color: var(--color-text);
  background: var(--color-surface);
  font-weight: 500;
}
.frm003__filter-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--color-text);
  color: var(--color-bg);
  font-size: 0.65rem;
  font-weight: 700;
}
.frm003__bar-sep { width: 1px; height: 18px; background: var(--color-border); flex-shrink: 0; }
.frm003__results-count { font-size: 0.8rem; color: var(--color-text-muted); white-space: nowrap; }
.frm003__bar-spacer { flex: 1; }
.frm003__sort-wrap {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-shrink: 0;
}
.frm003__sort-label { font-size: 0.8rem; color: var(--color-text-muted); white-space: nowrap; }
.frm003__sort-select {
  padding: var(--space-1) var(--space-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  font-size: 0.8rem;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-base);
  cursor: pointer;
}
@media (max-width: 767px) {
  .frm003__bar-spacer { display: none; }
}

/* Applied chips bar */
.frm003__applied-bar {
  padding: var(--space-2) var(--space-6);
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-wrap: wrap;
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
}
@media (max-width: 767px) {
  .frm003__applied-bar { padding: var(--space-2) var(--space-4); }
}
.frm003__applied-chip {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: 3px var(--space-2) 3px var(--space-3);
  border: 1px solid var(--color-text);
  border-radius: 999px;
  font-size: 0.75rem;
  color: var(--color-text);
  background: var(--color-surface);
}
.frm003__applied-remove {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--color-border);
  cursor: pointer;
  font-size: 0.65rem;
}
.frm003__clear-all {
  font-size: 0.75rem;
  color: var(--color-text-muted);
  text-decoration: underline;
  cursor: pointer;
  background: none;
  border: none;
  font-family: var(--font-base);
}

/* ═══════════════════════════════════════
   RESULTS LIST
═══════════════════════════════════════ */
.frm003__results {
  padding: var(--space-4) var(--space-6);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}
@media (max-width: 767px) {
  .frm003__results { padding: var(--space-4); }
}

/* Grid variant */
.frm003__results--grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: var(--space-4);
}
@media (max-width: 767px) {
  .frm003__results--grid { grid-template-columns: 1fr; }
}

.frm003__result {
  display: flex;
  gap: var(--space-4);
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-4);
  align-items: flex-start;
}
.frm003__results--grid .frm003__result {
  flex-direction: column;
  gap: var(--space-3);
}
.frm003__result-thumb {
  width: 48px;
  height: 48px;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  flex-shrink: 0;
}
.frm003__results--grid .frm003__result-thumb {
  width: 100%;
  height: 120px;
}
.frm003__result-body { flex: 1; min-width: 0; }
.frm003__result-meta {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin-bottom: var(--space-1);
}
.frm003__result-tag {
  font-size: 0.7rem;
  padding: 1px var(--space-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  color: var(--color-text-muted);
}
.frm003__result-date { font-size: 0.7rem; color: var(--color-text-muted); }
.frm003__result-title {
  font-size: 0.875rem;
  font-weight: 600;
  color: var(--color-text);
  margin-bottom: var(--space-1);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.frm003__results--grid .frm003__result-title {
  white-space: normal;
  overflow: visible;
  text-overflow: unset;
}
.frm003__result-desc {
  font-size: 0.8rem;
  color: var(--color-text-muted);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* ═══════════════════════════════════════
   FILTER PANEL — desktop sidebar
═══════════════════════════════════════ */
.frm003__split {
  display: flex;
  align-items: flex-start;
}
.frm003__panel {
  width: 220px;
  flex-shrink: 0;
  background: var(--color-bg);
  border-right: 1px solid var(--color-border);
  padding: var(--space-4) var(--space-4) var(--space-6);
  min-height: 360px;
}
@media (max-width: 767px) { .frm003__panel { display: none; } }

.frm003__panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-4);
}
.frm003__panel-title { font-size: 0.875rem; font-weight: 600; }
.frm003__panel-close {
  font-size: 0.75rem;
  color: var(--color-text-muted);
  cursor: pointer;
  text-decoration: underline;
  background: none;
  border: none;
  font-family: var(--font-base);
}
.frm003__panel-group { margin-bottom: var(--space-4); }
.frm003__panel-group-label {
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--color-text-muted);
  margin-bottom: var(--space-2);
}
.frm003__panel-opt {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-1) 0;
  cursor: pointer;
  font-size: 0.8125rem;
  color: var(--color-text);
}
.frm003__radio {
  width: 14px;
  height: 14px;
  border: 1.5px solid var(--color-border);
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.frm003__radio.on { border-color: var(--color-text); }
.frm003__radio.on::after {
  content: '';
  width: 6px;
  height: 6px;
  background: var(--color-text);
  border-radius: 50%;
}
.frm003__check {
  width: 14px;
  height: 14px;
  border: 1.5px solid var(--color-border);
  border-radius: 3px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.6rem;
}
.frm003__check.on { border-color: var(--color-text); background: var(--color-text); color: var(--color-bg); }
.frm003__range { padding: var(--space-2) 0; }
.frm003__range-bar { height: 4px; background: var(--color-border); border-radius: 2px; position: relative; margin-bottom: var(--space-1); }
.frm003__range-fill { position: absolute; left: 10%; right: 30%; height: 100%; background: var(--color-text); border-radius: 2px; }
.frm003__range-labels { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--color-text-muted); }
.frm003__panel-apply {
  width: 100%;
  padding: var(--space-2) var(--space-4);
  background: var(--color-text);
  color: var(--color-bg);
  border: none;
  border-radius: var(--radius-sm);
  font-size: 0.8125rem;
  font-weight: 600;
  cursor: pointer;
  font-family: var(--font-base);
  margin-top: var(--space-2);
}

.frm003__split-results { flex: 1; min-width: 0; }

/* Mobile bottom sheet overlay */
.frm003__overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.3);
  z-index: 40;
  display: flex;
  align-items: flex-end;
}
.frm003__sheet {
  width: 100%;
  background: var(--color-bg);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  padding: var(--space-4) var(--space-4) var(--space-12);
  max-height: 72vh;
  overflow-y: auto;
}
.frm003__sheet-handle {
  width: 40px;
  height: 4px;
  background: var(--color-border);
  border-radius: 2px;
  margin: 0 auto var(--space-4);
}
.frm003__sheet-apply {
  width: 100%;
  padding: var(--space-3) var(--space-4);
  background: var(--color-text);
  color: var(--color-bg);
  border: none;
  border-radius: var(--radius-sm);
  font-size: 0.875rem;
  font-weight: 600;
  cursor: pointer;
  font-family: var(--font-base);
  margin-top: var(--space-4);
}
/* Hide overlay on desktop */
@media (min-width: 768px) { .frm003__overlay { display: none !important; } }

/* ═══════════════════════════════════════
   EMPTY STATES
═══════════════════════════════════════ */
.frm003__empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-4);
  padding: var(--space-12) var(--space-6);
  text-align: center;
}
.frm003__empty-icon {
  width: 52px;
  height: 52px;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--color-text-muted);
}
.frm003__empty-title {
  font-size: 1rem;
  font-weight: 600;
  color: var(--color-text);
}
.frm003__empty-body {
  font-size: 0.875rem;
  color: var(--color-text-muted);
  max-width: 300px;
  line-height: 1.6;
}
.frm003__suggestions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  justify-content: center;
}
.frm003__sug-chip {
  padding: var(--space-1) var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: 999px;
  font-size: 0.8rem;
  color: var(--color-text);
  background: var(--color-bg);
  cursor: pointer;
  font-family: var(--font-base);
}
.frm003__empty-cta {
  padding: var(--space-2) var(--space-6);
  background: var(--color-text);
  color: var(--color-bg);
  border: none;
  border-radius: var(--radius-sm);
  font-size: 0.875rem;
  font-weight: 600;
  cursor: pointer;
  font-family: var(--font-base);
}

/* ═══════════════════════════════════════
   SKELETON (loading)
═══════════════════════════════════════ */
.frm003__sk {
  background: linear-gradient(90deg, var(--color-surface) 25%, var(--color-border) 50%, var(--color-surface) 75%);
  background-size: 300% 100%;
  animation: frm003-shimmer 1.4s infinite;
  border-radius: var(--radius-sm);
}
@keyframes frm003-shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
.frm003__sk--line { height: 12px; }
.frm003__sk--title { height: 15px; }
.frm003__sk--thumb { width: 48px; height: 48px; flex-shrink: 0; border-radius: var(--radius-sm); }
.frm003__sk--bar { height: 28px; border-radius: var(--radius-sm); }

/* ═══════════════════════════════════════
   ERROR
═══════════════════════════════════════ */
.frm003__error {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  background: #FEF2F2;
  border: 1px solid #FECACA;
  border-radius: var(--radius-md);
  padding: var(--space-4);
  margin: var(--space-4) var(--space-6);
}
@media (max-width: 767px) {
  .frm003__error { margin: var(--space-4); flex-wrap: wrap; }
}
.frm003__error-icon { color: #DC2626; flex-shrink: 0; }
.frm003__error-text { font-size: 0.875rem; color: #991B1B; flex: 1; line-height: 1.5; }
.frm003__error-retry {
  padding: var(--space-1) var(--space-3);
  border: 1px solid #DC2626;
  border-radius: var(--radius-sm);
  background: none;
  color: #DC2626;
  font-size: 0.8rem;
  cursor: pointer;
  white-space: nowrap;
  font-family: var(--font-base);
}
@media (max-width: 767px) {
  .frm003__error-retry { width: 100%; margin-top: var(--space-2); text-align: center; }
}
</style>
</head>
<body>

<!-- ══════════════════════════════════════════════
     MÓDULO — copiar al proyecto de cliente
     ══════════════════════════════════════════════ -->
<section class="section" id="frm003-section" aria-label="Buscador">
  <div id="frm003-root">
    <!-- Renderizado por JS según estado activo -->
  </div>
</section>
<!-- fin módulo -->


<!-- ══════════════════════════════════════════════
     PANEL DE ESTADOS — herramienta del kit, no copiar
     ══════════════════════════════════════════════ -->
<details class="kit-states">

  <div class="kit-states__body">

      <span class="kit-states__group-label">Search experience</span>

      <label><input type="radio" name="frm003-state" value="autocomplete"> Autocomplete</label>

    <div class="kit-states__group">
      <span class="kit-states__group-label">Results experience</span>
      <label><input type="radio" name="frm003-state" value="results"> Resultados</label>
      <label><input type="radio" name="frm003-state" value="filters"> Filtros abiertos</label>
      <label><input type="radio" name="frm003-state" value="applied"> Filtros aplicados</label>
    </div>

    <div class="kit-states__group">
      <span class="kit-states__group-label">Estados vacíos</span>
      <label><input type="radio" name="frm003-state" value="no-results"> Sin resultados</label>

      <label><input type="radio" name="frm003-state" value="error"> Error</label>

    <div class="kit-states__group" id="frm003-layout-group">
      <span class="kit-states__group-label">Layout de resultados</span>
      <label><input type="radio" name="frm003-layout" value="list" checked> Lista</label>
      <label><input type="radio" name="frm003-layout" value="grid"> Cuadrícula</label>

    <div class="kit-states__group">

    'applied': function (layout) {

    'no-results': function () {

    'loading': function () {
      return topbar() +

      return topbar() +
        '<div class="frm003__error" role="alert">' + I.warn +

        '</div>';
    },

  var currentLayout = 'list';
  var layoutGroup   = document.getElementById('frm003-layout-group');
  var RESULTS_STATES = ['results', 'filters', 'applied', 'no-results-f'];

  function render() {
    var fn = STATES[currentState];
    root.innerHTML = fn ? fn(currentLayout) : '';

    if (layoutGroup) {
      layoutGroup.hidden = RESULTS_STATES.indexOf(currentState) === -1;

  // State radios
  document.querySelectorAll('input[name="frm003-state"]').forEach(function (r) {
    r.addEventListener('change', function () {
      if (r.checked) { currentState = r.value; render(); }
    });
  });

  // Layout radios
  document.querySelectorAll('input[name="frm003-layout"]').forEach(function (r) {
    r.addEventListener('change', function () {
      if (r.checked) { currentLayout = r.value; render(); }
    });
  });

  // Background radios
  document.querySelectorAll('input[name="frm003-bg"]').forEach(function (r) {
    r.addEventListener('change', function () {
      if (r.checked) {
        section.style.background = r.value === 'surface' ? 'var(--color-surface)' : '';
      }
    });
  });

  render();
}());
